<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card .title {
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">Photo Gallery</h1>
    <div class="gallery">
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+1" alt="Placeholder Image 1">
            <div class="title">Image 1</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+2" alt="Placeholder Image 2">
            <div class="title">Image 2</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+3" alt="Placeholder Image 3">
            <div class="title">Image 3</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+4" alt="Placeholder Image 4">
            <div class="title">Image 4</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+5" alt="Placeholder Image 5">
            <div class="title">Image 5</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+6" alt="Placeholder Image 6">
            <div class="title">Image 6</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+7" alt="Placeholder Image 7">
            <div class="title">Image 7</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+8" alt="Placeholder Image 8">
            <div class="title">Image 8</div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+9" alt="Placeholder Image 9">
            <div class="title">Image 9</div>
        </div>
    </div>
</body>
</html>
